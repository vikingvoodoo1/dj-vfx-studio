name: Build and Release DJ VFX Studio

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Build Electron App & Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish always

  create-github-release:
    name: Publish Release Notes
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: DJ VFX Studio ${{ github.ref_name }}
          body: |
            ## 🎛️ DJ VFX Studio ${{ github.ref_name }} Release
            
            ### ✨ Highlights in v2.0.0
            - **Pioneer CDJ-3000 Phrase Meter & CDJ-2000 Phase Visualizer**: Real-time Rekordbox structural phrase analysis, 8-segment bar progress tracks, countdown to drop, 4-beat phase grid with 60FPS needle sweep, DUAL stacked mode, and hardware Pro DJ Link / beat clock sync.
            - **3-Layer 3D Branding & Event Promo Engine**: Dedicated GPU-accelerated layers for DJ Logo (MP4 video/images), Station Logo, and Event Flyer/Promo Graphics with 9-way directional anchoring, 6 display modes, and 10 cinematic transition effects.
            - **Multi-Layer Automation & Pop-Up Scheduler**: Automated periodic pop-ups with configurable intervals (`30s` to `30m`), display durations (`5s` to `60s`), and manual `⚡ POP NOW` / `⏹️ POP OFF` action triggers.
            - **Shazam AI Live Audio Recognition & Album Art**: 1-click live audio sampling with Shazam fingerprint matching, high-res Apple Music artwork retrieval, and live broadcast lower-third banners.
            - **22 GPU-Accelerated 3D Stage Visual Engines**: Moving-head godray fixtures, Protean volumetric fog, retro 70s illuminated disco dancefloors, VHS glitch typography, 3D stadium equalizers, starfields, and laser arrays.
            - **Philips Hue Smart Club Lighting Integration**: Real-time 4-mode beat sync, wide-gamut HSV color mapping, independent lamp power toggle, and instantaneous Xenon-white Kick Pop Strobes.
            - **6 Curated UI Console Themes**: `Cyber Glass`, `Studio Hardware Pro` (Universal Audio skeuomorphic console), `Cyberpunk Matrix`, `Obsidian Stealth`, `Titanium Pioneer Pro`, and `Analog Synthwave Studio`.
            - **Universal Multi-Platform DJ Bridge**: Zero-latency companion bridge for Denon DJ StageLinq, Pioneer Pro DJ Link, Native Instruments Traktor Pro, Serato DJ, and VirtualDJ.
            - **Multi-Screen, Projector & OBS Live Suite**: Detached master control console (`?mode=controller`), 2nd screen stage projector output (`?mode=obs`), and alpha-blended transparent OBS browser sources (`?overlay=true`).
            
            ### 📦 Download Instructions:
            - **macOS (Apple Silicon & Intel)**: Download the `.dmg` or `.zip` file below. Drag into your Applications folder.
            - **Windows 10/11**: Download the `.exe` (Installer or Portable).
            - **Linux**: Download the `.AppImage` and run `chmod +x` to execute.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
